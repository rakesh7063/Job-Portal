spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/job_portal?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:change-me-in-prod-change-me-in-prod}
app.jwt.expiration-seconds=${JWT_EXP_SECONDS:86400}

server.port=8080

# Gmail SMTP; off by default. Set MAIL_ENABLED=true and MAIL_PASSWORD (Google App Password).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:rakeshkandar416@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:rakeshkandar416@gmail.com}
