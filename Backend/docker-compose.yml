services:
  mysql:
    image: mysql:8.0
    container_name: jobportal-mysql
    environment:
      # Creates database on first container start (empty volume).
      MYSQL_DATABASE: job_portal
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
    container_name: jobportal-api
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/job_portal?createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: change-me-in-prod-change-me-in-prod
      JWT_EXP_SECONDS: 86400
      # Gmail SMTP (optional). Set MAIL_ENABLED=true and MAIL_PASSWORD (Google App Password).
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-rakeshkandar416@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-rakeshkandar416@gmail.com}
    ports:
      - "8080:8080"

