spring.application.name=Backend

# createDatabaseIfNotExist: creates schema on first connect if MySQL user allows it (local dev).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/job_portal?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:change-me-in-prod-change-me-in-prod}
app.jwt.expiration-seconds=${JWT_EXP_SECONDS:86400}

# Gmail SMTP — set MAIL_PASSWORD to a Google "App Password" (Google Account → Security → 2-Step Verification → App passwords). Never commit it.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:rakeshkandar416@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:rakeshkandar416@gmail.com}
#GEMINI_API_KEY:AIzaSyCP38l7BgamXMYiX2nPXZZV6zggTRjiMLw
# Gemini AI Configuration
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.enabled=${GEMINI_ENABLED:true}