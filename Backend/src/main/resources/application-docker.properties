spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/job_portal}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:change-me-in-prod-change-me-in-prod}
app.jwt.expiration-seconds=${JWT_EXP_SECONDS:86400}

server.port=8080

