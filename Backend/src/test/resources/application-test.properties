# In-memory DB for unit/integration tests (no Docker MySQL required).
spring.datasource.url=jdbc:h2:mem:jobportal;DB_CLOSE_DELAY=-1;MODE=MYSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.mail.enabled=false

app.jwt.secret=test-secret-test-secret-test-secret-test-secret
app.jwt.expiration-seconds=3600
